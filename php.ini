; Custom PHP configuration for IT-PROYEK-SEMESTER-3
; This file enables intl extension for the project

; Enable intl extension
extension=intl

; Memory limit
memory_limit = 256M

; Upload limits
upload_max_filesize = 20M
post_max_size = 20M

; Error reporting
display_errors = On
error_reporting = E_ALL

; Timezone
date.timezone = Asia/Jakarta
